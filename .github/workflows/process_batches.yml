name: Process customer batches

on:
  workflow_dispatch:
  push:
    branches:
      - data-automation
      - main
    paths:
      - "simulator_batches/incoming/batch_*.csv"

permissions:
  contents: read

jobs:
  clean-batches:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install -r B_Channel/requirements_B.txt -r requirements-segments.txt

      - name: Combine received batches
        run: python batch_demo.py process --folder simulator_batches

      - name: Clean the data and generate a quality report
        run: |
          mkdir -p reports
          python data_exam.py simulator_batches/customers_received.csv > reports/batch_data_quality.txt
          test -s simulator_batches/customer_clean.csv
          cat reports/batch_data_quality.txt

      - name: Run channel analysis
        run: python B_Channel/channel_analysis.py --input simulator_batches/customer_clean.csv --output reports/batch_channels

      - name: Score customer segments
        run: python segmentation.py score --input simulator_batches/customer_clean.csv --output reports/batch_segments

      - name: Upload cleaned data and quality report
        uses: actions/upload-artifact@v7
        with:
          name: customer-batch-results
          path: |
            simulator_batches/customer_clean.csv
            reports/batch_data_quality.txt
            reports/batch_channels/
            reports/batch_segments/
          if-no-files-found: error